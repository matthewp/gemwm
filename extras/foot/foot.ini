# foot, dressed as an Atari ST terminal (VT52 on the mono monitor).
#
# Used by gemwm-terminal, which puts it on top of your own foot.ini and
# picks the light or dark theme you chose last (Options > Terminal Theme,
# or `gemwm-terminal theme light|dark`). Ctrl+Shift+D flips one window.
#
# Light is the SM124's black on white; dark is reverse video. All colours
# are ST palette values (3 bits per channel: 00 24 49 6d 92 b6 db ff), and
# selection inverts, as GEM highlights.

[main]
# The ST's own 8x16 system font, whole pixels only (see extras/fonts).
font=Atari ST 8x16:pixelsize=16
pad=4x4

[cursor]
style=block
blink=yes

[key-bindings]
color-theme-toggle=Control+Shift+d

[colors-light]
background=ffffff
foreground=000000
selection-foreground=ffffff
selection-background=000000
cursor=ffffff 000000
regular0=000000
regular1=b60000
regular2=00b600
regular3=b6b600
regular4=0000b6
regular5=b600b6
regular6=00b6b6
regular7=b6b6b6
bright0=6d6d6d
bright1=ff6d6d
bright2=6dff6d
bright3=ffff6d
bright4=6d6dff
bright5=ff6dff
bright6=6dffff
bright7=ffffff

# Reverse video: the same palette, brightened to read on black.
[colors-dark]
background=000000
foreground=ffffff
selection-foreground=000000
selection-background=ffffff
cursor=000000 ffffff
regular0=000000
regular1=db2424
regular2=24db24
regular3=dbdb24
regular4=4949ff
regular5=db24db
regular6=24dbdb
regular7=b6b6b6
bright0=6d6d6d
bright1=ff6d6d
bright2=6dff6d
bright3=ffff6d
bright4=9292ff
bright5=ff6dff
bright6=6dffff
bright7=ffffff
